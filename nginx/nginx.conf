server {
    listen 80;
    server_name _;

    client_max_body_size 1m;

    location = / {
        default_type text/plain;
        return 200 "Dine-N-Dash API Gateway\n";
    }

    location = /api/mobility {
        return 308 /api/mobility/;
    }

    location ^~ /api/mobility/ {
        proxy_pass http://campus-mobility-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/food {
        return 308 /api/food/;
    }

    location ^~ /api/food/ {
        proxy_pass http://food-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/meal-planning {
        return 308 /api/meal-planning/;
    }

    location ^~ /api/meal-planning/ {
        proxy_pass http://meal-planning-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/users {
        return 308 /api/users/;
    }

    location ^~ /api/users/ {
        proxy_pass http://user-service:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
